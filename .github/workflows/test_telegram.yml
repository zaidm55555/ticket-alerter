name: Test Telegram Notifications

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Bot 1 -> User 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "--- Bot 1 sending to TELEGRAM_CHAT_ID ---"
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=🧪 Test from Bot 1 to User 1")
          echo "Response: $RESPONSE"

      - name: Test Bot 2 -> User 2
        env:
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          echo "TELEGRAM_BOT_TOKEN_2 is set: $([ -n "$TELEGRAM_BOT_TOKEN_2" ] && echo YES || echo NO)"
          echo "TELEGRAM_CHAT_ID_2 is set: $([ -n "$TELEGRAM_CHAT_ID_2" ] && echo YES || echo NO)"
          echo "--- Bot 2 sending to TELEGRAM_CHAT_ID_2 ---"
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN_2}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID_2}&text=🪙 Gold Coin Price Update test - Bot 2 working!")
          echo "Response: $RESPONSE"
